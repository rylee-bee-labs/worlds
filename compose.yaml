# ─────────────────────────────────────────────────────────────────
# Project Worlds — Portable Appliance
# ─────────────────────────────────────────────────────────────────
#
# `docker compose up -d` brings up everything a new user needs:
#
#   core        — the Worlds API + frontend (port 8000)
#   ollama      — local reasoning brain (qwen3:1.7b, no API key)
#   ollama-pull — one-shot init that downloads the model on first boot
#
# Persistent volumes:
#   world-data  — your world, journal, prefs, vault, secrets
#   config-data — server config (SSO details, provider connections)
#   ollama-data — downloaded LLM models (survives restarts)
#
# Required:
#   PW_API_TOKEN — your API key (generate with the command below)
#
# Optional:
#   PW_IMAGE     — override the container image (default: ghcr.io)
#   XIAOMI_MIMO_API_KEY — if using Xiaomi MiMo as reasoning provider
#
# Generate a token:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Then create .env in this directory:
#   PW_API_TOKEN=your-generated-token-here
#
# ─────────────────────────────────────────────────────────────────

services:

  # ── Ollama — Local Reasoning Brain ─────────────────────────────
  #
  # Runs a local LLM (qwen3:1.7b) so chat works without any
  # external API account. Models persist in the ollama-data volume.
  #
  # To swap models later:
  #   1. docker compose exec ollama ollama pull <model>
  #   2. Edit config/connections.json inside the core container
  #      (the config-data volume) with the new model name
  #
  # To use a different reasoning provider (OpenAI, Anthropic, etc.),
  # remove the ollama entry from connections.json and add your own.
  #
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Model Bootstrap (runs once, then exits) ────────────────────
  #
  # Downloads qwen3:1.7b on first boot. Subsequent boots skip
  # because the model already exists in the ollama-data volume.
  # core waits for this to finish before starting.
  #
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3:1.7b"]

  # ── Project Worlds Core ────────────────────────────────────────
  #
  # The main application: API server + frontend.
  #
  # Healthcheck verifies the server is responding: GET /healthz -> 200.
  # Worlds production auth is the owner.yaml bootstrap, not a token; the
  # route returns only {ok, commit} (worlds/server.py).
  #
  # Volumes:
  #   world-data — persistent storage for your world state
  #
  core:
    image: ${PW_IMAGE:-ghcr.io/rylee-bee/personal-world:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "${PW_PORT:-8000}:8000"
    environment:
      # ── Required ──────────────────────────────────────────────
      # Your API key. Generate with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      PW_API_TOKEN: ${PW_API_TOKEN:-}

      # ── Optional: External reasoning providers ────────────────
      # Only needed if you swap from Ollama to a cloud provider.
      # The portable base ships with Ollama and needs no keys.
      XIAOMI_MIMO_API_KEY: ${XIAOMI_MIMO_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # ── Optional: reverse-proxy trust ────────────────────────
      # Comma-separated IPs/CIDRs of the proxy (or proxies) allowed
      # to set X-Forwarded-*; this also keys the sign-in rate limit
      # per client. The server refuses to boot if the value is
      # malformed. Leave unset when Worlds is not behind a proxy.
      PW_TRUSTED_PROXIES: ${PW_TRUSTED_PROXIES:-}

      # ── Optional: owner sign-in before OIDC works ────────────
      # owner.yaml's bootstrap.secret_ref names this variable
      # (env:PW_BOOTSTRAP_TOKEN); at least 22 base64url characters.
      PW_BOOTSTRAP_TOKEN: ${PW_BOOTSTRAP_TOKEN:-}

      # ── Optional: Web Push (docs/NOTIFICATIONS.md) ──────────
      # Unset = push reads "not configured"; history still works.
      PW_VAPID_PRIVATE_KEY: ${PW_VAPID_PRIVATE_KEY:-}
      PW_VAPID_SUBJECT: ${PW_VAPID_SUBJECT:-}

      # ── Optional: OIDC / SSO ─────────────────────────────────
      # Only needed if using an OIDC provider (e.g. Authelia).
      # The setup wizard writes SSO details to the config-data
      # volume automatically; a manual file goes to /config/oidc.json.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

      # ── Optional: Lab CLI path ────────────────────────────────
      # Only needed if connecting to a homelab Lab CLI instance.
      # PW_LAB_CLI: /opt/scripts/lab
    volumes:
      - world-data:/data
      # /config must survive container recreation: the setup wizard
      # writes SSO details there, and setup-complete (in world-data)
      # prevents re-running the wizard — without this volume, an image
      # update silently breaks sign-in. Named volume (no host paths):
      # keeps the portable-base rule of the 2026-09-12 decision.
      - config-data:/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; \
              r=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4); \
              sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Volumes ──────────────────────────────────────────────────────
#
# world-data:  Your world — facts, intents, policies, journal,
#              preferences, vault, sections, reminders.
#              This is your data. Back it up.
#
# config-data: Server config the wizard or you write to /config —
#              oidc.json (SSO), connections.json (providers).
#              Backup note: lives inside a named volume, so back it
#              up from inside the container (see docs/WORLDS-BACKUP.md),
#              not from a host path.
#
# ollama-data: Downloaded LLM models. Safe to delete if you want
#              to reclaim disk space (models re-download on next boot).
#
volumes:
  world-data:
  config-data:
  ollama-data:
