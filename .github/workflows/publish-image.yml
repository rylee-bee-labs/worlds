name: publish-image

# Build the Project Worlds appliance once in CI and publish it to
# GitHub Container Registry.
#
# This repository publishes its OWN image. The `personal-world` repository
# is archived read-only (owner decision 2026-10-26), so it can no longer be
# the source of the image the homelab runs; the production instance on the
# transcode host is built from here instead.
#
# The image is consumed as `ghcr.io/rylee-bee-labs/worlds:main` by the
# homelab autodeploy (`scripts/lab ship rylee-bee-labs/worlds --main`).
# `:latest` (fresh installs) and `:sha-<full SHA>` (immutable, the
# documented rollback handle) are published alongside it.
#
# Triggered via `workflow_run` after the `validate` workflow completes
# successfully on main -- that keeps this job from ever publishing a
# known-broken image merely because a push occurred. SHA tags are
# immutable and are the documented rollback path; `latest` advances on
# each successful main publish.
#
# Manual republish: only a RE-RUN of a push-triggered `validate` run
# re-fires this workflow (the re-run keeps the original `push` event, so
# the `workflow_run.event == 'push'` gate accepts it). `validate` has no
# `workflow_dispatch` trigger, and a `workflow_dispatch`-triggered run
# would be excluded by that same gate anyway, so there is no manual
# republish path here today -- a manual publish needs a new trigger
# added on purpose, not a promise in this comment.
#
# The publish job also refuses a stale commit: it compares the validated
# SHA with main's current tip and skips the build when they differ, so a
# successful `validate` for an older commit can never reset `:main`
# backwards. A newer `validate` run publishes the newer commit.
#
# The publish path is gated on this repository: a fork can never publish
# into the estate's registry, and nothing here runs on a pull request.

on:
  workflow_run:
    workflows: ["validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # The image this repository publishes, written out in full rather than
  # derived from the event payload: a fork (or a rewritten payload) must
  # never be able to redirect the push at another repository's package.
  IMAGE: ghcr.io/rylee-bee-labs/worlds

jobs:
  changes:
    # Build only when something that goes INTO the image changed since the
    # commit baked into the current :main image (not merely the previous
    # commit: a cancelled build must never let code slip past). Docs, tests
    # and CI-only merges skip the build, and `lab ship --main` then leaves
    # the running Worlds alone ("no app change"). Owner decision 2026-09-27.
    # IMAGE_INPUTS mirrors the Dockerfile's COPY sources: keep them in sync.
    if: >
      github.repository == 'rylee-bee-labs/worlds' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to GHCR (to read the current image's revision label)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Did anything in the image change?
        id: decide
        env:
          HEAD: ${{ github.event.workflow_run.head_sha }}
          BASE_IMAGE: ${{ env.IMAGE }}:main
        run: |
          set -uo pipefail
          IMAGE_INPUTS='^(src/|ui/|design/|docs/library/|pyproject\.toml$|uv\.lock$|README\.md$|Dockerfile$|\.dockerignore$)'
          NOT_SHIPPED='^ui/(e2e|uat|\.storybook)/|^ui/src/test/|\.test\.tsx?$|\.spec\.tsx?$|\.stories\.tsx$'
          base=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$HEAD" 2>/dev/null; then
            echo "No usable base image revision; building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$HEAD" | grep -E "$IMAGE_INPUTS" | grep -Ev "$NOT_SHIPPED" || true)
          if [ -n "$changed" ]; then
            echo "App files changed since ${base:0:7}:"; echo "$changed" | head -40
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing in the image changed since ${base:0:7}; skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    # workflow_run only fires after the upstream completed; gate on its
    # conclusion so a failed validate never ships an image. The repository
    # gate repeats here so the push can never leave this repository's
    # package, whatever the event payload says.
    needs: changes
    if: >-
      needs.changes.outputs.build == 'true' &&
      github.repository == 'rylee-bee-labs/worlds'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.event.repository.full_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}" \
              --jq '.head_sha')
          echo "head_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Publishing image for ${REPO}@${sha}"

      - name: Refuse a stale validated SHA
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${REPO}/commits/main" --jq '.sha')
          echo "main tip:      ${tip}"
          echo "validated SHA: ${HEAD_SHA}"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::main is at ${tip}, but this run validated ${HEAD_SHA}."
            echo "Skipping the build: publishing the older commit would reset :main backwards."
            echo "The newer validate run publishes the newer commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validated source
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `:main` is the tag the homelab autodeploy pulls; `:latest` is
          # the convenience tag; the SHA tag is immutable and is the
          # documented rollback handle. No `enable=` guard on the branch
          # tags: the job gate already proves this is a main publish, and
          # a missing `:main` would leave the deployed instance on a stale
          # image.
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Project Worlds
            org.opencontainers.image.description=Project Worlds — calm, accessible personal environment (API + dashboard)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.revision=${{ steps.sha.outputs.head_sha }}
            org.opencontainers.image.created=${{ github.event.workflow_run.head_commit.timestamp }}

      - name: Build and push
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same validated SHA as the label above, but inside the image
          # too: /healthz reports its short form so a running Worlds can
          # be compared against main without inspecting image metadata.
          build-args: |
            PW_COMMIT=${{ steps.sha.outputs.head_sha }}
          # Layer cache: dependency layers are reused, so most builds only
          # redo the UI build and the source copy.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance: the image carries the build's own attestation.
          provenance: true
