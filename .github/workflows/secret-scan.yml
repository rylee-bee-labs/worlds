name: secret-scan

# Gitleaks secret scan, called from the estate's reusable workflow rather
# than re-implemented here, so there is exactly one copy of the scan config
# in the estate rather than one per repo (same reasoning as the claims policy
# in ci.yml: the policy is owned by ci-harness and pinned by SHA).
#
# Unpushed on every branch and every PR: a secret caught on a feature branch
# before it reaches main is the whole point, so this has no path filter.

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # NOTE: a job that calls a reusable workflow may only have `uses` and
  # `with` keys. Adding `runs-on:` here (as a normal job would have) makes
  # GitHub reject the entire workflow file, so the runner is passed through
  # `with:` below instead.
  #
  # CI_RUNNER/CI_RUNNER_LIGHT are set by the estate; whether this repo
  # defines them as repo variables is not verifiable from a checkout, so the
  # expression falls back to ubuntu-latest exactly as ci.yml does.
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@0973e4167ff88353f3789f08ea64ff3926eb7559
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}