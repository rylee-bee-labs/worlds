name: validate

# Contract workflow — pipeline *mechanics* live in rylee-bee-labs/ci-harness
# (workflow_call reusable templates; every action SHA is pinned in exactly
# one place: ci-harness/pins/ACTIONS.md). This file owns only this repo's
# *semantics*: which checks gate merges and with what arguments.
#
# Job-for-job parity with the previous hand-written pipeline:
#   test / compose / browser / security-gates / framework-gates — plus the
#   new contract-freshness gate (no pre-existing equivalent; it watches
#   the ratified Play-Nice pin).
# The compose job intentionally stays inline here: the compose-config check
# fits none of the four templates, and contorting a template to host it
# would be dishonest plumbing. See ci-harness README for adoption.

on:
  push:
    branches: [main]
  pull_request:
  # Heartbeat for the Play-Nice pin (the heart): weekly off-peak check
  # that the ratified adoption pin still reads CURRENT upstream. GitHub
  # fires schedules only on the default branch; PRs re-check the same job
  # on every push. push/pull_request carry no paths filter, so a change to
  # .project/contracts/adoption.yaml already fires this workflow — adding
  # an explicit paths list would narrow existing triggers, so none was.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-python.yml@697df0d496aefd87ca35a9f6b7fd159276f8a858  # ci-harness main, pinned 2026-10-15
    with:
      sync-args: "--extra test --extra crypto"
      pytest-args: "--timeout=30"
      # 2026-10-15 trial on Bazzite: 330s serial -> ~103s with -n 4, three runs. The one failure seen
      # (#343) also fails serially, so it is a flaky test, not a parallel-ordering problem.
      pytest-workers: 4
      enable-ruff: true
      enable-bandit: true
      bandit-args: "-q -r . -x ./tests,./.venv,./node_modules -s B101"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # pin managed by ci-harness/pins/ACTIONS.md
        with:
          persist-credentials: false
      - name: Compose config validates
        run: |
          echo "PW_API_TOKEN=ci-placeholder-token" > .env
          docker compose config -q
      - name: Image builds (ui/ interface stage + runtime stage)
        run: docker build -t personal-world:ci .

  browser:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-node.yml@697df0d496aefd87ca35a9f6b7fd159276f8a858  # ci-harness main, pinned 2026-10-15
    with:
      working-directory: "ui"
      setup-python: true
      sync-args: "--extra test"
      build-command: "npm run build"
      test-command: "npx playwright install --with-deps chromium && npx playwright test"
      upload-dist: false

  security-gates:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-python.yml@697df0d496aefd87ca35a9f6b7fd159276f8a858  # ci-harness main, pinned 2026-10-15
    with:
      sync-args: "--extra test"
      pytest-args: '--timeout=30 tests/test_core.py -k "SettingsExportSafety or CementedPolicy or TestJournal or WorldExport" -v'
      enable-ruff: true
      enable-bandit: true
      bandit-args: "-q -r . -x ./tests,./.venv,./node_modules -s B101"

  framework-gates:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-python.yml@697df0d496aefd87ca35a9f6b7fd159276f8a858  # ci-harness main, pinned 2026-10-15
    with:
      sync-args: "--extra test"
      pytest-args: "--timeout=30 tests/test_framework.py -v"
      enable-ruff: true
      enable-bandit: true
      bandit-args: "-q -r . -x ./tests,./.venv,./node_modules -s B101"
      post-test-commands: "uv run personal-world framework validate --json"

  # The heart, kept honest automatically: Play-Nice contract currency —
  # is the ratified v0.10.0 pin in .project/contracts/adoption.yaml still
  # the current remote revision? Fails closed (green only on CURRENT;
  # BEHIND/DIVERGED exit 1; UNREACHABLE/UNKNOWN exit 2). Detection is
  # automated; re-pinning source.revision stays a manual, attested ritual
  # — never a sync job. This job going red after upstream moved is a
  # correct alarm, not a malfunction.
  contract-freshness:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-contract-freshness.yml@697df0d496aefd87ca35a9f6b7fd159276f8a858  # ci-harness main, pinned 2026-10-15
    with:
      manifest-path: ".project/contracts/adoption.yaml"
      # Pull requests: Play-Nice moving is a warning, not a block. The pin
      # robot (play-nice-contracts tools/pin-sync) opens and merges the pin
      # PR. Pushes to main and the weekly schedule stay strict.
      expect: ${{ github.event_name == 'pull_request' && 'warn' || 'current' }}
