# Estate dependabot template (agent-platform docs/ops/dependabot.md, 2026-10-27):
# - minor + patch arrive as ONE grouped PR per ecosystem; a major is its own PR, held for a look;
# - security updates are grouped too, and are not delayed by the cooldown;
# - a 3-day cooldown (14 for majors) lets a bad release get yanked before it reaches us;
# - docs/archive/** is frozen history and never gets a bump;
# - weekly on wednesday, so the estate's runners do not all get every PR at the same hour.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      npm-ui-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-ui-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:  # carried over from the previous file
      - dependency-name: msw
        versions: ['>=3.0.0']
