# Estate dependabot template (agent-platform docs/ops/dependabot.md, 2026-10-27):
# - minor + patch arrive as ONE grouped PR per ecosystem; a major arrives as its own PR;
# - security updates are grouped too, are not delayed by the cooldown, and open as soon as an advisory
#   lands -- the schedule below only paces version updates;
# - a 3-day cooldown (14 for majors, where the ecosystem supports it) lets a bad release get yanked first;
# - docs/archive/** is frozen history and never gets a bump;
# - weekly (a live service), on wednesday: each live service has its own weekday, so the shared runners do
#   not get every repo's PRs on the same morning; the ecosystems in one repo share its day on purpose.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    exclude-paths:
      - "docs/archive/**"
    groups:
      # CodeQL refuses to run when its init and analyze steps are different versions
      # (personal-world#299/#300, 2026-10-12): bump every codeql-action step in one PR, majors included.
      codeql-action:
        patterns: [github/codeql-action*]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:  # ci-harness pins belong to bin/harness-repin; the rest carried over from the previous file
      - {dependency-name: rylee-bee-labs/ci-harness*}
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 14
    exclude-paths:
      - "docs/archive/**"
    groups:
      npm-ui-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-ui-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:  # ci-harness pins belong to bin/harness-repin; the rest carried over from the previous file
      - dependency-name: msw
        versions: ['>=3.0.0']
