library_proposals:
  based_on_observed_session: 2026-09-12T19:08:54Z..19:21:50Z
  status: NOT ADOPTED
  status_detail: >-
    These are friction-derived observations from the Auto Free cold-onboard
    experiment. They are recorded for traceability, not as project-local
    contracts. Submit to Rylee-Bee/play-nice-contracts separately; do NOT
    implement as project-local contracts in this repo.
  proposals:
    - id: contractctl-availability
      targets_contract: ask-for-help + stable-truth-replaceable-machinery
      problem: >-
        The canonical Play-Nice onboarding tool (contractctl) is not
        installed in the local working environment. Without it, the full
        attestation path (RESOLVE, READ, VERIFY, ATTTESTATION,
        COMMITMENT, ACTIVE) cannot be completed; onboarding is forced to
        PROVISIONAL. The project-local validate-packs provides only coarse
        checks (YAML parse + schema/id keys + ID uniqueness) and does not
        resolve or attest contracts.
      observed_cost: >-
        This session could not run contractctl resolve or contractctl
        onboard; the adoption pin was honored unchanged and packs marked
        PROVISIONAL per the freshness escape hatch.
      proposed_shape: >-
        A deterministic onboarding surface that projects can invoke
        regardless of whether the canonical library checkout is present
        locally — at minimum, a way to verify the adoption pin revision
        and lockfile against the live repository and resolve the
        applicable contract subset for a task.
      friction_owner: Play-Nice tooling
      friction_severity: high

    - id: structural-conformance-gap
      targets_contract: contract-attestation + stable-truth-replaceable-machinery
      problem: >-
        The project-local validate_participant_packs validator (in
        framework.py) only checks YAML parseability, required top-level
        keys (schema, id), schema namespace, and ID uniqueness. It does
        NOT validate structural conformance to the full participant-v1
        schema (missing type, profile, provenance, authentication,
        limitations all pass silently). A manual structural audit
        revealed that figma and kilo packs are missing the profile
        section entirely, glm-5.3-flash is missing authentication and
        limitations, and big-pickle is missing profile.status.
      observed_cost: >-
        4 of 6 existing packs have structural gaps that pass validation
        without detection; only a manual audit surfaced them.
      proposed_shape: >-
        Either extend the project validator with a structural
        conformance check per participant-v1 (optional fields with
        defaults, but required fields flagged), or ensure contractctl
        structural validation runs as part of the project test gate.
      friction_owner: Project Worlds tooling
      friction_severity: medium

    - id: runtime-model-identity-observation
      targets_contract: provenance-and-audit + truth-and-evidence
      problem: >-
        The Kilo harness config (kilo.jsonc) specifies a model
        (kilo/minimax/minimax-m3) but the session provider mode is
        "Auto Free" (system prompt: kilo/kilo-auto/free). No tool within
        the session can query the actual responding model identity.
        This makes it impossible to verify whether the configured model,
        the routing mode, and the actual responding model are the same.
      observed_cost: >-
        The experiment's core goal (profile the responding brain) could
        not be fully achieved; the actual model is recorded as UNKNOWN.
      proposed_shape: >-
        Expose the actual responding model identifier as an observable
        field within Kilo sessions (e.g. an environment variable or a
        read-only MCP resource), so participant profiling can record
        identity with certainty rather than config inference.
      friction_owner: Kilo / provider
      friction_severity: high

    - id: harness-version-drift
      targets_contract: stable-truth-replaceable-machinery
      problem: >-
        The kilo participant pack records "v7.5.9" but the actual
        KILOCODE_VERSION environment variable is 7.6.2. Participant packs
        are manually authored and do not auto-sync to the harness version.
      observed_cost: >-
        Stale version metadata could mislead future sessions about the
        harness capabilities they should expect.
      proposed_shape: >-
        Either auto-inject KILOCODE_VERSION into the harness
        participant pack, or add a version-drift check to validate-packs.
      friction_owner: Kilo participant pack
      friction_severity: low
