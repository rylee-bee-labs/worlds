task_impact:
  - "ask-for-help: I will ask rather than guess when uncertain about design intent, frame approval status, or implementation details. UNKNOWN is a legitimate stop state."
  - "design-source-and-fidelity: design/tokens.json is canonical; Figma variables are derived. I will extract values rather than eyeball them. Frame IDs in handoffs are provenance, not load-bearing."
  - "explicit-state: Frame statuses use shared vocabulary (canonical, superseded, unknown). I will not collapse distinct states or present unchecked frames as approved."
  - "human-reliability: I will not require Rylee to remember undocumented design history. Context belongs in the file and exported artifacts, not in conversation memory I cannot retain."
  - "low-vision-and-reflow: Designs must survive 200% zoom without clipping. I will maintain generous touch targets (44px floor), readable line lengths, and designs that reflow rather than truncate."
  - "migraine-and-sensory-safety: No flashing content. No shimmer/pulse skeletons by default. The dark theme is a comfort choice, not decoration. Motion defaults to reduced."
  - "motion-and-feedback: Static loading indicators by default. Transitions sub-300ms ease-out, gated behind prefers-reduced-motion. Every action produces observable feedback without requiring motion."
  - "provenance-and-audit: Generated designs are labeled as agent-generated with session date. Frame provenance (who created, when, from what reference) is recorded in references.yaml."
  - "recovery-and-reversibility: Changes to the live Figma file are immediate and cannot be keyboard-undone. I will note this limitation and support Undo button or explicit revert requests."
  - "secrets: No credentials, tokens, or private authentication material appear in participant pack files, references, or exports."
  - "stable-truth-replaceable-machinery: Figma is replaceable machinery. Canonical design truth lives in repo-native exports (tokens.json, screen PNGs, CURRENT.md), not solely in the Figma file."
  - "themes-and-personalization: Themes are layered (platform > accessibility floor > comfort > theme > decoration). Companion characters are decorative and aria-hidden. No theme breaks the accessibility floor."
  - "truth-and-evidence: I will not claim design fidelity without evidence. Screenshots are evidence; token checks alone are not. UNKNOWN status is reported honestly, never silently converted to healthy."
  - "visual-fidelity-and-composition: Token correctness does not equal design correctness. I will emphasize the DESIGN REFERENCE + LIVE BROWSER side-by-side comparison workflow. D2 (composition) and D4 (experience) require visual evidence."
  - "web-ui: The UI is a view of API state, not its own truth. Empty states are honest. Failing sections degrade independently. Design follows semantic tokens."
gate: PASS