cards:
  routing:
    - name: healthy
      responses:
        overview: {http: {routers: {total: 14, warnings: 0, errors: 0}, services: {total: 14, warnings: 0, errors: 0}}}
      expect:
        state: healthy
        values:
          routes: "14"
          with-errors: "0"
          with-warnings: "0"
    - name: some routes have errors
      responses:
        overview: {http: {routers: {total: 14, warnings: 1, errors: 2}}}
      expect:
        state: needs_attention
        values:
          with-errors: "2"
    - name: unavailable
      responses:
        overview:
          __status: 500
      expect:
        state: unavailable
