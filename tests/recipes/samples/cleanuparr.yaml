# Bodies are made up in an assumed shape: the real /api/v2/stats keys are unknown.
cards:
  cleanup:
    - name: normal
      responses:
        stats:
          timeframe: 7d
          removed: 12
          strikes: 0
      expect:
        state: healthy
        values: {}
    - name: unavailable
      responses:
        stats:
          __status: 500
      expect:
        state: unavailable
        values: {}
    - name: empty
      responses:
        stats: {}
      expect:
        state: healthy
        values: {}
