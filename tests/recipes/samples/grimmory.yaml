cards:
  reading:
    - name: normal
      responses:
        library:
          total: 128
          authors: 40
        wanted:
          total: 5
      expect:
        state: healthy
        values:
          in-library: "128 books"
          authors: "40 authors"
          wanted: "5 wanted"
    - name: empty
      responses:
        library:
          total: 0
          authors: 0
        wanted:
          total: 0
      expect:
        state: healthy
        values:
          in-library: "0 books"
          authors: "0 authors"
          wanted: "0 wanted"
    - name: unavailable
      responses:
        library:
          __status: 500
        wanted:
          __status: 500
      expect:
        state: unavailable
        values:
          in-library: unknown
          authors: unknown
          wanted: unknown
